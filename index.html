<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Для тебя ❤️</title>

<style>
body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  color:white;
  overflow:hidden;

  background:
    linear-gradient(rgba(0,0,0,.55), rgba(0,0,0,.7)),
    url("https://images.openai.com/static-rsc-3/eOMVXF13574z__TZLntve-T7gRniOxTDguV2w0b8TdiPlLPTjENxmrNIvtr2NHVM1NcSVA5oycAPobdYt7NkSfucJxaJvi5SM1dkNhRtPQw?purpose=fullsize&v=1")
    center/cover no-repeat fixed;
}

/* glow */
body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:
    radial-gradient(circle at 50% 120%, rgba(255,140,120,.35), transparent 60%);
}

.card{
  width:min(650px,90%);
  background:rgba(0,0,0,.6);
  backdrop-filter: blur(12px);
  border-radius:24px;
  padding:32px 24px;
  text-align:center;
  box-shadow:0 30px 80px rgba(0,0,0,.6);
  animation:fadeIn .6s ease;
}

@keyframes fadeIn{
  from{opacity:0; transform:translateY(10px);}
  to{opacity:1; transform:translateY(0);}
}

h1{font-size:28px;margin-bottom:20px;}
p{font-size:18px;line-height:1.7;white-space:pre-line;min-height:100px;}

button{
  margin-top:25px;
  padding:14px 22px;
  border:none;
  border-radius:16px;
  font-size:16px;
  font-weight:600;
  cursor:pointer;
  background:white;
  color:black;
  transition:.2s;
}
button:hover{opacity:.9}

.hidden{display:none}

/* hearts */
.hearts{
  position:fixed;
  inset:0;
  pointer-events:none;
}
.heart{
  position:absolute;
  animation:floatUp 3s ease-in forwards;
}
@keyframes floatUp{
  0%{transform:translateY(30px) scale(.8); opacity:0}
  15%{opacity:1}
  100%{transform:translateY(-110vh) scale(1.4); opacity:0}
}
</style>
</head>
<body>

<div class="hearts" id="hearts"></div>

<div class="card">

  <!-- Экран 1 -->
  <div id="screen1">
    <h1>У меня для тебя кое-что ❤️</h1>
    <button id="openBtn">Открыть</button>
  </div>

  <!-- Экран 2 -->
  <div id="screen2" class="hidden">
    <h1>Приглашение</h1>

    <p id="typing"></p>

    <p>
      📍 Vista<br>
      🕰 19:00<br>
      🚗 Я заеду за тобой в 18:00
    </p>

    <button id="yesBtn">Я буду ❤️</button>
  </div>

</div>

<script>
const text = `Я хочу пригласить тебя на вечер, который для меня многое значит.

Это не просто свидание.
Это шаг.`;

const screen1 = document.getElementById("screen1");
const screen2 = document.getElementById("screen2");
const typingEl = document.getElementById("typing");

function sleep(ms){
  return new Promise(resolve => setTimeout(resolve, ms));
}

async function typeText(){
  typingEl.textContent = "";
  for(let i = 0; i < text.length; i++){
    typingEl.textContent += text[i];
    await sleep(28);
  }
}

function burstHearts(){
  const hearts = document.getElementById("hearts");
  const emojis = ["❤️","🤍","💗","💞","💖"];
  for(let i=0;i<18;i++){
    const h = document.createElement("div");
    h.className="heart";
    h.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    h.style.left = Math.random()*100+"vw";
    h.style.top = "80vh";
    h.style.fontSize = (16 + Math.random()*20)+"px";
    hearts.appendChild(h);
    setTimeout(()=>h.remove(),3000);
  }
}

document.getElementById("openBtn").addEventListener("click", async ()=>{
  screen1.classList.add("hidden");
  screen2.classList.remove("hidden");
  burstHearts();
  await typeText();
});

document.getElementById("yesBtn").addEventListener("click", ()=>{
  burstHearts();
  typingEl.textContent = "Тогда я сделаю всё, чтобы этот вечер был идеальным ❤️";
});
</script>

</body>
</html>
